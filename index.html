<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hotel Sheetal – Date Wise Sales Report</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2433;--mut:#6b7280;--line:#e5e1d8;--acc:#9a3412;--acc2:#7c2d12;--ok:#166534;--hd:#fbeee3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161b;--card:#1c1f26;--ink:#eceef2;--mut:#9aa1ad;--line:#2d313b;--acc:#f08a4b;--acc2:#e0713a;--ok:#4ade80;--hd:#2a2420}}
:root[data-theme="dark"]{--bg:#14161b;--card:#1c1f26;--ink:#eceef2;--mut:#9aa1ad;--line:#2d313b;--acc:#f08a4b;--acc2:#e0713a;--ok:#4ade80;--hd:#2a2420}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
.wrap{max-width:900px;margin:0 auto;padding:20px 14px 40px}
h1{margin:0;font-size:1.5rem;letter-spacing:.04em;color:var(--acc)}
.sub{color:var(--mut);margin:2px 0 18px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
label{display:block;font-size:.8rem;color:var(--mut);margin-bottom:4px;font-weight:600}
input[type=text],input[type=number],input[type=date]{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:1rem}
.chk{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:.9rem}
.chk label{display:flex;align-items:center;gap:6px;margin:0;color:var(--ink);font-weight:500}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
button{padding:10px 16px;border-radius:8px;border:1px solid var(--acc);background:var(--acc);color:#fff;font-size:.95rem;font-weight:600;cursor:pointer}
html[data-theme="dark"] button.p,button.p{color:#fff}
button.s{background:transparent;color:var(--acc)}
button:disabled{opacity:.45;cursor:not-allowed}
.msg{margin-top:10px;font-size:.88rem;min-height:1.2em}
.err{color:#dc2626}.good{color:var(--ok)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:480px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{background:var(--hd);font-size:.82rem}
tfoot td{font-weight:700;background:var(--hd);border-top:2px solid var(--acc)}
@media (max-width:600px){
 .wrap{padding:14px 8px 30px}
 h1{font-size:1.25rem}
 .card{padding:12px;border-radius:10px}
 .grid{grid-template-columns:1fr 1fr;gap:10px}
 .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
 .btns #gen{grid-column:1/-1}
 button{padding:12px 8px;font-size:.9rem}
 .tw{padding:6px}
 table{min-width:0}
 th,td{padding:7px 4px;font-size:.76rem;white-space:normal}
 th{font-size:.7rem}
}
@media (max-width:360px){.grid{grid-template-columns:1fr}}
.empty{color:var(--mut);text-align:center;padding:26px 0}
</style>
</head>
<body>
<div class="wrap">
  <h1>HOTEL SHEETAL</h1>
  <p class="sub">Date Wise Sales Report Generator</p>

  <div class="card">
    <div class="grid">
      <div><label>From Date</label><input type="date" id="from"></div>
      <div><label>To Date</label><input type="date" id="to"></div>
      <div><label>Total Liquor Sale (₹)</label><input type="number" id="liq" min="0" step="0.01" placeholder="e.g. 485320.50"></div>
      <div><label>Total Food Sale (₹)</label><input type="number" id="food" min="0" step="0.01" placeholder="e.g. 312780.75"></div>
    </div>
    <div class="chk">
      <label><input type="checkbox" id="paise" checked> Include paise (e.g. 4,382.65)</label>
      <label><input type="checkbox" id="wknd" checked> Higher sales on Fri/Sat/Sun</label>
    </div>
    <div class="btns">
      <button id="gen">Generate Report</button>
      <button class="s" id="regen" disabled>Regenerate (new random)</button>
      <button class="s" id="xl" disabled>Export Excel</button>
      <button class="s" id="pdf" disabled>Export PDF</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card tw">
    <table>
      <thead><tr><th>Date</th><th>Liquor Sale (₹)</th><th>Food Sale (₹)</th><th>Total Sale (₹)</th></tr></thead>
      <tbody id="body"><tr><td colspan="4" class="empty">Enter dates and totals, then click Generate Report.</td></tr></tbody>
      <tfoot id="foot"></tfoot>
    </table>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let rows = [], meta = {};
const pad = n => String(n).padStart(2,'0');
const fmtDate = d => pad(d.getUTCDate())+'-'+pad(d.getUTCMonth()+1)+'-'+d.getUTCFullYear();
const inr = (v,p) => (v/(p?100:1)).toLocaleString('en-IN',{minimumFractionDigits:p?2:0,maximumFractionDigits:p?2:0});
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));

// default dates: current month so far
(function(){
  const t=new Date(), y=t.getFullYear(), m=t.getMonth();
  const f=new Date(Date.UTC(y,m,1)), l=new Date(Date.UTC(y,m+1,0));
  $('from').value=f.toISOString().slice(0,10); $('to').value=l.toISOString().slice(0,10);
})();

const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
function monthLabel(fd,td){
  const a=MN[fd.getUTCMonth()],b=MN[td.getUTCMonth()],ya=fd.getUTCFullYear(),yb=td.getUTCFullYear();
  if(ya===yb&&fd.getUTCMonth()===td.getUTCMonth()) return {text:a+' '+ya,file:a+'_'+ya};
  return {text:a+' '+ya+' to '+b+' '+yb,file:a.slice(0,3)+'_'+ya+'_to_'+b.slice(0,3)+'_'+yb};
}
function bad(v,paise){ return paise ? (v%100===0 || v%10===0) : (v%5===0); }

// split `total` (integer units) into n non-round parts that sum exactly to total
function split(total,n,weights,paise){
  if(total<=0) return Array(n).fill(0);
  if(n===1) return [total];
  const sw = weights.reduce((a,b)=>a+b,0);
  const a = weights.map(w=>Math.floor(total*w/sw));
  a[n-1] += total - a.reduce((x,y)=>x+y,0);
  const unit = paise?100:1, avg = total/n;
  const maxD = Math.max(7, Math.floor(avg*0.03));
  for(let pass=0; pass<6; pass++){
    let changed=false;
    for(let i=0;i<n;i++){
      if(!bad(a[i],paise)) continue;
      for(let k=0;k<60;k++){
        let j = rnd(0,n-1); if(j===i) continue;
        const d = rnd(1,maxD) * (Math.random()<.5?1:-1);
        const ni=a[i]+d, nj=a[j]-d;
        if(ni>0 && nj>0 && !bad(ni,paise) && !bad(nj,paise)){ a[i]=ni; a[j]=nj; changed=true; break; }
      }
    }
    if(!changed) break;
  }
  return a;
}

function generate(){
  const msg=$('msg'); msg.className='msg';
  const f=$('from').value, t=$('to').value;
  const liqIn=parseFloat($('liq').value), foodIn=parseFloat($('food').value);
  if(!f||!t){ msg.textContent='Please select both dates.'; msg.classList.add('err'); return; }
  const fd=new Date(f+'T00:00:00Z'), td=new Date(t+'T00:00:00Z');
  if(td<fd){ msg.textContent='"To Date" must be after "From Date".'; msg.classList.add('err'); return; }
  const n=Math.round((td-fd)/864e5)+1;
  if(n>366){ msg.textContent='Maximum 366 days allowed.'; msg.classList.add('err'); return; }
  if(!(liqIn>=0)||!(foodIn>=0)||(isNaN(liqIn)&&isNaN(foodIn))){ msg.textContent='Enter total Liquor and Food sale amounts.'; msg.classList.add('err'); return; }
  const paise=$('paise').checked, wk=$('wknd').checked, u=paise?100:1;
  const L=Math.round((liqIn||0)*u), F=Math.round((foodIn||0)*u);
  const dates=[], mk=()=>{ const w=[]; for(let i=0;i<n;i++){ const d=new Date(fd.getTime()+i*864e5); const dow=d.getUTCDay(); w.push((0.55+Math.random()*0.95)*(wk&&(dow===0||dow===5||dow===6)?1.3:1)); } return w; };
  for(let i=0;i<n;i++) dates.push(new Date(fd.getTime()+i*864e5));
  const la=split(L,n,mk(),paise), fa=split(F,n,mk(),paise);
  rows=dates.map((d,i)=>({date:fmtDate(d),liq:la[i],food:fa[i],tot:la[i]+fa[i]}));
  meta={paise,u,from:fmtDate(fd),to:fmtDate(td),L,F,month:monthLabel(fd,td)};
  render();
  const sl=rows.reduce((a,r)=>a+r.liq,0), sf=rows.reduce((a,r)=>a+r.food,0);
  msg.textContent = (sl===L&&sf===F) ? '✓ Report generated – daily figures add up exactly to your totals.' : 'Generated.';
  msg.classList.add('good');
  ['regen','xl','pdf'].forEach(id=>$(id).disabled=false);
}

function render(){
  const p=meta.paise;
  $('body').innerHTML=rows.map(r=>`<tr><td>${r.date}</td><td>${inr(r.liq,p)}</td><td>${inr(r.food,p)}</td><td>${inr(r.tot,p)}</td></tr>`).join('');
  const sl=rows.reduce((a,r)=>a+r.liq,0), sf=rows.reduce((a,r)=>a+r.food,0);
  $('foot').innerHTML=`<tr><td>TOTAL</td><td>${inr(sl,p)}</td><td>${inr(sf,p)}</td><td>${inr(sl+sf,p)}</td></tr>`;
}

async function save(filename,data,mime){
  const msg=$('msg'); msg.className='msg';
  try{
    const dl = window.claude && await window.claude.use("downloads");
    if(dl){ await dl.save({filename,data}); msg.textContent='File ready: '+filename; msg.classList.add('good'); return; }
  }catch(e){
    if(e && e.code==='declined'){ msg.textContent='Download cancelled.'; return; }
  }
  // fallback for normal browsers
  const url=URL.createObjectURL(new Blob([data],{type:mime}));
  const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}

function exportExcel(){
  const p=meta.paise, v=x=>x/meta.u;
  const aoa=[['HOTEL SHEETAL'],['Date Wise Sales Report - '+meta.month.text+' ('+meta.from+' to '+meta.to+')'],[],
    ['Date','Liquor Sale (₹)','Food Sale (₹)','Total Sale (₹)']];
  rows.forEach(r=>aoa.push([r.date,v(r.liq),v(r.food),v(r.tot)]));
  const first=5,last=4+rows.length;
  aoa.push(['TOTAL',{f:`SUM(B${first}:B${last})`},{f:`SUM(C${first}:C${last})`},{f:`SUM(D${first}:D${last})`}]);
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  const tr=last+1, sum=k=>rows.reduce((a,r)=>a+r[k],0)/meta.u;
  ws['B'+tr]={t:'n',f:`SUM(B${first}:B${last})`,v:sum('liq')};
  ws['C'+tr]={t:'n',f:`SUM(C${first}:C${last})`,v:sum('food')};
  ws['D'+tr]={t:'n',f:`SUM(D${first}:D${last})`,v:sum('tot')};
  const fmt=p?'#,##0.00':'#,##0';
  for(let r=first;r<=tr;r++) ['B','C','D'].forEach(c=>{ if(ws[c+r]) ws[c+r].z=fmt; });
  ws['!cols']=[{wch:14},{wch:18},{wch:18},{wch:18}];
  ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:3}},{s:{r:1,c:0},e:{r:1,c:3}}];
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,meta.month.text.length<=31?meta.month.text:'Sales Report');
  const buf=XLSX.write(wb,{type:'array',bookType:'xlsx'});
  save('Hotel_Sheetal_Sales_Report_'+meta.month.file+'.xlsx',new Blob([buf]),'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
}

function exportPDF(){
  const p=meta.paise;
  const {jsPDF}=window.jspdf, doc=new jsPDF({unit:'mm',format:'a4'});
  const W=doc.internal.pageSize.getWidth();
  doc.setFont('helvetica','bold'); doc.setFontSize(18); doc.text('HOTEL SHEETAL',W/2,16,{align:'center'});
  doc.setFontSize(11); doc.setFont('helvetica','normal');
  doc.text('Date Wise Sales Report - '+meta.month.text+'  ('+meta.from+' to '+meta.to+')',W/2,23,{align:'center'});
  const sl=rows.reduce((a,r)=>a+r.liq,0), sf=rows.reduce((a,r)=>a+r.food,0);
  // fit everything (incl. total row) on ONE page: scale row height & font by number of rows
  const H=doc.internal.pageSize.getHeight(), top=29, bot=8;
  const rh=Math.min(8,(H-top-bot)/(rows.length+2));
  const pad=rh>7?1.8:(rh>5?1.1:0.6);
  const fs=Math.max(4.5,Math.min(10,(rh-2*pad)/0.42));
  doc.autoTable({
    startY:top,
    margin:{top:top,bottom:bot,left:14,right:14},
    head:[['Date','Liquor Sale (Rs.)','Food Sale (Rs.)','Total Sale (Rs.)']],
    body:rows.map(r=>[r.date,inr(r.liq,p),inr(r.food,p),inr(r.tot,p)]),
    foot:[['TOTAL',inr(sl,p),inr(sf,p),inr(sl+sf,p)]],
    showFoot:'lastPage',
    theme:'grid',
    styles:{fontSize:fs,cellPadding:pad,halign:'right',valign:'middle',minCellHeight:rh-0.2},
    columnStyles:{0:{halign:'left'}},
    headStyles:{fillColor:[154,52,18],textColor:255,halign:'right'},
    footStyles:{fillColor:[251,238,227],textColor:20,fontStyle:'bold',halign:'right'},
    didParseCell:d=>{ if(d.column.index===0) d.cell.styles.halign='left'; }
  });
  save('Hotel_Sheetal_Sales_Report_'+meta.month.file+'.pdf',doc.output('blob'),'application/pdf');
}

function endOfMonth(){
  const f=$('from').value; if(!f) return;
  const [y,m]=f.split('-').map(Number);
  $('to').value=new Date(Date.UTC(y,m,0)).toISOString().slice(0,10);
}
$('from').addEventListener('change',endOfMonth);
$('gen').onclick=generate; $('regen').onclick=generate;
$('xl').onclick=exportExcel; $('pdf').onclick=exportPDF;
</script>
</body>
</html>
